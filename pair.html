<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fee-XMD WhatsApp Pairing Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #7c3aed;
      --primary-dark: #5b21b6;
      --secondary: #06b6d4;
      --accent: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --background: #0f172a;
      --surface: #1e293b;
      --surface-light: #334155;
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --gradient-primary: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      --gradient-secondary: linear-gradient(135deg, var(--secondary) 0%, var(--accent) 100%);
      --gradient-warning: linear-gradient(135deg, #f59e0b 0%, #f97316 100%);
      --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.4);
      --shadow-xl: 0 25px 50px rgba(0, 0, 0, 0.5);
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: var(--background);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: var(--text-primary);
      overflow-x: hidden;
      position: relative;
      padding: 20px;
    }

    .tech-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
      background: 
        radial-gradient(circle at 20% 30%, rgba(124, 58, 237, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(6, 182, 212, 0.1) 0%, transparent 50%),
        radial-gradient(circle at 40% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 50%),
        linear-gradient(180deg, #0f172a 0%, #0a0f1d 100%);
    }

    .grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(124, 58, 237, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124, 58, 237, 0.05) 1px, transparent 1px);
      background-size: 50px 50px;
      z-index: -1;
      opacity: 0.5;
    }

    .floating-shapes {
      position: fixed;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .floating-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.15;
      animation: float 20s ease-in-out infinite;
    }

    .shape-1 {
      width: 300px;
      height: 300px;
      background: var(--primary);
      top: 10%;
      left: 10%;
      animation-delay: 0s;
    }

    .shape-2 {
      width: 400px;
      height: 400px;
      background: var(--secondary);
      top: 60%;
      right: 10%;
      animation-delay: -5s;
    }

    .shape-3 {
      width: 250px;
      height: 250px;
      background: var(--accent);
      bottom: 10%;
      left: 20%;
      animation-delay: -10s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-30px) rotate(180deg); }
    }

    .dashboard-container {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 30px;
      opacity: 0;
      animation: fadeInUp 0.8s ease-out forwards;
      z-index: 2;
      position: relative;
    }

    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Header Section */
    .header-section {
      text-align: center;
      margin-bottom: 20px;
    }

    .bot-avatar {
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
      position: relative;
      animation: avatarFloat 4s ease-in-out infinite;
    }

    @keyframes avatarFloat {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      33% { transform: translateY(-10px) rotate(3deg); }
      66% { transform: translateY(-5px) rotate(-3deg); }
    }

    .avatar-container {
      width: 100%;
      height: 100%;
      background: var(--gradient-primary);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      box-shadow: 
        0 10px 30px rgba(124, 58, 237, 0.3),
        0 0 0 4px rgba(124, 58, 237, 0.1),
        inset 0 0 20px rgba(255, 255, 255, 0.1);
    }

    .avatar-screen {
      width: 70px;
      height: 40px;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.2);
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
    }

    .screen-particles {
      position: absolute;
      width: 100%;
      height: 100%;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: var(--secondary);
      border-radius: 50%;
      animation: particleMove 3s linear infinite;
    }

    @keyframes particleMove {
      0% { transform: translateY(40px) translateX(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(0) translateX(40px); opacity: 0; }
    }

    .main-title {
      font-size: 42px;
      font-weight: 800;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      letter-spacing: -1px;
      margin-bottom: 10px;
      position: relative;
      display: inline-block;
    }

    .main-title::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 3px;
      background: var(--gradient-primary);
      border-radius: 2px;
      animation: widthPulse 3s infinite alternate;
    }

    @keyframes widthPulse {
      0% { width: 100px; }
      100% { width: 140px; }
    }

    .main-subtitle {
      color: var(--text-secondary);
      font-size: 18px;
      max-width: 600px;
      margin: 20px auto 0;
    }

    /* Main Card */
    .dashboard-card {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      padding: 40px 35px;
      border: 1px solid rgba(124, 58, 237, 0.3);
      box-shadow: var(--shadow-xl), 0 0 40px rgba(124, 58, 237, 0.2);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .dashboard-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--gradient-primary);
      opacity: 0.1;
      z-index: -1;
    }

    .dashboard-card::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        45deg,
        transparent 30%,
        rgba(124, 58, 237, 0.1) 50%,
        transparent 70%
      );
      animation: shine 3s infinite linear;
      z-index: -1;
    }

    @keyframes shine {
      0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
      100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
    }

    /* Input Section */
    .input-group {
      width: 100%;
      margin-bottom: 30px;
    }

    .input-label {
      display: block;
      text-align: left;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 10px;
      padding-left: 5px;
    }

    .input-wrapper {
      display: flex;
      gap: 12px;
      background: rgba(15, 23, 42, 0.8);
      padding: 4px;
      border-radius: 16px;
      border: 1px solid rgba(124, 58, 237, 0.3);
      transition: all 0.3s ease;
      box-shadow: 
        inset 0 2px 10px rgba(0, 0, 0, 0.2),
        0 4px 20px rgba(15, 23, 42, 0.5);
    }

    .input-wrapper:focus-within {
      border-color: rgba(124, 58, 237, 0.8);
      box-shadow: 
        inset 0 2px 10px rgba(0, 0, 0, 0.2),
        0 0 30px rgba(124, 58, 237, 0.3);
      transform: translateY(-2px);
    }

    .phone-input {
      flex: 1;
      padding: 18px 20px;
      border: none;
      border-radius: 14px;
      background: rgba(30, 41, 59, 0.9);
      color: var(--text-primary);
      font-size: 16px;
      font-weight: 500;
      transition: all 0.3s ease;
      font-family: 'Segoe UI', monospace;
      letter-spacing: 1px;
    }

    .phone-input::placeholder {
      color: var(--text-muted);
      font-weight: 400;
    }

    .phone-input:focus {
      outline: none;
      background: rgba(40, 51, 69, 0.9);
      box-shadow: 0 0 0 2px rgba(124, 58, 237, 0.2);
    }

    .generate-btn {
      padding: 18px 32px;
      background: var(--gradient-primary);
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.3);
    }

    .generate-btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.6s ease, height 0.6s ease;
    }

    .generate-btn:hover::before {
      width: 300px;
      height: 300px;
    }

    .generate-btn:hover {
      background: var(--gradient-secondary);
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(124, 58, 237, 0.4);
    }

    .generate-btn:active {
      transform: translateY(-1px);
    }

    /* Loader */
    .loader-container {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 30px;
    }

    .modern-loader {
      width: 60px;
      height: 60px;
      position: relative;
    }

    .loader-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 3px solid transparent;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1.5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    .loader-ring:nth-child(2) {
      border-top-color: var(--secondary);
      animation-delay: 0.3s;
      width: 80%;
      height: 80%;
      top: 10%;
      left: 10%;
    }

    .loader-ring:nth-child(3) {
      border-top-color: var(--accent);
      animation-delay: 0.6s;
      width: 60%;
      height: 60%;
      top: 20%;
      left: 20%;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loader-text {
      color: var(--text-secondary);
      font-size: 15px;
      font-weight: 500;
      text-align: center;
    }

    .loader-text::after {
      content: '';
      animation: loadingDots 1.5s infinite;
    }

    @keyframes loadingDots {
      0%, 20% { content: ''; }
      40% { content: '.'; }
      60% { content: '..'; }
      80%, 100% { content: '...'; }
    }

    /* Result Display */
    .result-container {
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 20px;
      min-height: 120px;
    }

    .code-display {
      background: rgba(15, 23, 42, 0.8);
      border-radius: 16px;
      padding: 25px;
      width: 100%;
      border: 1px solid rgba(124, 58, 237, 0.3);
      box-shadow: 
        0 10px 30px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      animation: slideInUp 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes slideInUp {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .code-label {
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .code-value {
      font-size: 32px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 3px;
      padding: 20px;
      background: rgba(30, 41, 59, 0.8);
      border-radius: 12px;
      margin-bottom: 20px;
      font-family: 'Courier New', monospace;
      text-align: center;
      border: 1px solid rgba(124, 58, 237, 0.2);
      position: relative;
      overflow: hidden;
    }

    .code-value::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(124, 58, 237, 0.1), transparent);
      animation: codeShine 3s infinite;
    }

    @keyframes codeShine {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    .code-highlight {
      color: var(--secondary);
      font-weight: 800;
    }

    /* Interactive Buttons - Matching Bot Format */
    .interactive-buttons {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      width: 100%;
      margin: 20px 0;
    }

    .interactive-btn {
      padding: 16px;
      background: rgba(30, 41, 59, 0.9);
      color: var(--text-primary);
      border: 1px solid rgba(124, 58, 237, 0.4);
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      position: relative;
      overflow: hidden;
      text-decoration: none;
    }

    .interactive-btn:hover {
      background: rgba(124, 58, 237, 0.2);
      border-color: var(--primary);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(124, 58, 237, 0.2);
    }

    .interactive-btn.copy-btn {
      grid-column: span 2;
      background: var(--gradient-primary);
      border: none;
      color: white;
    }

    .interactive-btn.copy-btn:hover {
      background: var(--gradient-secondary);
    }

    .interactive-btn.copy-btn.copied {
      background: rgba(16, 185, 129, 0.9);
    }

    .interactive-btn i {
      font-size: 18px;
    }

    /* Footer */
    .footer-text {
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 30px;
      padding: 20px;
      border-top: 1px solid rgba(124, 58, 237, 0.2);
    }

    .footer-text i {
      color: var(--primary);
      margin: 0 4px;
    }

    /* Info Message */
    .info-message {
      color: var(--text-secondary);
      font-size: 13px;
      margin-top: 25px;
      padding: 16px;
      background: rgba(124, 58, 237, 0.05);
      border-radius: 12px;
      border-left: 3px solid var(--primary);
      text-align: left;
      width: 100%;
      line-height: 1.5;
    }

    .info-message i {
      color: var(--primary);
      margin-right: 8px;
    }

    /* Error Message */
    .error-message {
      color: var(--danger);
      text-align: center;
      padding: 20px;
      background: rgba(239, 68, 68, 0.1);
      border-radius: 12px;
      border-left: 3px solid var(--danger);
      width: 100%;
    }

    /* API Status */
    .api-status {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(10px);
      padding: 8px 16px;
      border-radius: 40px;
      border: 1px solid rgba(124, 58, 237, 0.3);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      z-index: 1000;
    }

    .status-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--danger);
    }

    .status-indicator.online {
      background: var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* Security Badge */
    .security-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.1);
      color: var(--accent);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      margin-top: 20px;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    /* Responsive */
    @media (max-width: 520px) {
      .dashboard-container {
        padding: 10px;
      }

      .dashboard-card {
        padding: 30px 20px;
      }

      .bot-avatar {
        width: 100px;
        height: 100px;
      }

      .avatar-screen {
        width: 60px;
        height: 32px;
      }

      .main-title {
        font-size: 32px;
      }

      .input-wrapper {
        flex-direction: column;
        gap: 8px;
        padding: 16px;
      }

      .phone-input,
      .generate-btn {
        width: 100%;
        padding: 16px;
      }

      .code-value {
        font-size: 24px;
        letter-spacing: 2px;
        padding: 15px;
      }

      .interactive-buttons {
        grid-template-columns: 1fr;
      }

      .interactive-btn.copy-btn {
        grid-column: span 1;
      }

      .api-status {
        top: 10px;
        right: 10px;
        font-size: 11px;
        padding: 6px 12px;
      }
    }
  </style>
</head>
<body>
  <!-- API Status Indicator -->
  <div class="api-status" id="apiStatus">
    <span class="status-indicator" id="statusIndicator"></span>
    <span id="statusText">Checking API...</span>
  </div>

  <div class="tech-background"></div>
  <div class="grid-overlay"></div>
  <div class="floating-shapes">
    <div class="floating-shape shape-1"></div>
    <div class="floating-shape shape-2"></div>
    <div class="floating-shape shape-3"></div>
  </div>

  <div class="dashboard-container">
    <!-- Header with Bot Avatar -->
    <div class="header-section">
      <div class="bot-avatar">
        <div class="avatar-container">
          <div class="avatar-screen">
            <div class="screen-particles" id="particles"></div>
          </div>
        </div>
      </div>
      <h1 class="main-title">FEE-XMD BOT</h1>
      <p class="main-subtitle">🩷 DEVICE WANT TO LOGIN - Get your WhatsApp pairing code</p>
    </div>

    <!-- Main Card -->
    <div class="dashboard-card">
      <!-- Input Section -->
      <div class="input-group">
        <label class="input-label">
          <i class="fas fa-mobile-alt"></i> WhatsApp Number
        </label>
        <div class="input-wrapper">
          <input 
            type="tel" 
            id="number" 
            class="phone-input"
            placeholder="2557xxxxxxxx"
            pattern="[0-9]*"
            inputmode="numeric"
            value="255"
          >
          <button id="submitBtn" class="generate-btn">
            <i class="fas fa-bolt"></i> Generate Code
          </button>
        </div>
      </div>

      <!-- Loader -->
      <div class="loader-container" id="waiting-message">
        <div class="modern-loader">
          <div class="loader-ring"></div>
          <div class="loader-ring"></div>
          <div class="loader-ring"></div>
        </div>
        <div class="loader-text">Securely generating your pairing code</div>
      </div>

      <!-- Result Container -->
      <main class="result-container" id="result"></main>

      <!-- Info Message -->
      <div class="info-message">
        <i class="fas fa-shield-alt"></i>
        This is your Code - Tap the button below to copy. Powered by Fee-XMD
      </div>

      <!-- Security Badge -->
      <div class="security-badge">
        <i class="fas fa-lock"></i>
        <span>End-to-End Encrypted • One-time use only</span>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer-text">
      <i class="fas fa-heart"></i> powered by fee-xmd <i class="fas fa-heart"></i>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>
  <script>
    const API_BASE = 'https://fee-ses.onrender.com';
    let currentPairingCode = '';

    // Create particles animation
    function createParticles() {
      const particlesContainer = document.getElementById('particles');
      if (!particlesContainer) return;
      
      particlesContainer.innerHTML = '';
      for (let i = 0; i < 12; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.cssText = `
          left: ${Math.random() * 100}%;
          animation-delay: ${Math.random() * 3}s;
          animation-duration: ${Math.random() * 2 + 2}s;
          background: hsl(${Math.random() * 60 + 180}, 100%, 70%);
        `;
        particlesContainer.appendChild(particle);
      }
    }

    // Check API status
    async function checkAPIStatus() {
      const indicator = document.getElementById('statusIndicator');
      const statusText = document.getElementById('statusText');
      
      try {
        // Try to hit the API endpoint
        const response = await fetch(`${API_BASE}/code?number=255700000000`, { 
          method: 'GET',
          headers: {
            'Accept': 'application/json'
          }
        });
        
        if (response.ok) {
          indicator.className = 'status-indicator online';
          statusText.textContent = 'API Online';
        } else {
          indicator.className = 'status-indicator';
          statusText.textContent = `API Error ${response.status}`;
        }
      } catch (error) {
        console.error('API Check Error:', error);
        indicator.className = 'status-indicator';
        statusText.textContent = 'API Unavailable';
      }
    }

    // Format phone number
    function formatPhoneNumber(input) {
      // Remove all non-numeric characters
      let value = input.replace(/[^0-9]/g, '');
      
      // If starts with 0, replace with 255
      if (value.startsWith('0')) {
        value = '255' + value.substring(1);
      }
      
      // If doesn't start with 255 and has content, add 255
      if (!value.startsWith('255') && value.length > 0) {
        value = '255' + value;
      }
      
      // Limit to 12 digits (255 + 9 digits)
      return value.substring(0, 12);
    }

    // Copy code function
    async function copyPairingCode(button) {
      if (!currentPairingCode) return;
      
      try {
        await navigator.clipboard.writeText(currentPairingCode);
        
        button.classList.add('copied');
        const originalHTML = button.innerHTML;
        button.innerHTML = '<i class="fas fa-check"></i> Code Copied!';
        
        setTimeout(() => {
          button.classList.remove('copied');
          button.innerHTML = originalHTML;
        }, 2000);
      } catch (err) {
        alert('Failed to copy code');
      }
    }

    // Generate pair code using exact endpoint from script
    async function generatePairCode() {
      const phoneInput = document.getElementById('number');
      const submitBtn = document.getElementById('submitBtn');
      const waitingMessage = document.getElementById('waiting-message');
      const resultContainer = document.getElementById('result');
      
      // Validate input
      if (!phoneInput.value) {
        resultContainer.innerHTML = `
          <div class="error-message">
            <i class="fas fa-exclamation-circle"></i> ⁉️ Use Example: 25575259xxxx to get Fee-Xmd code
          </div>
        `;
        return;
      }

      // Clean and format number exactly like in the bot script
      const cleanNumber = phoneInput.value.replace(/[^0-9]/g, '');
      phoneInput.value = cleanNumber;

      if (cleanNumber.length < 11) {
        resultContainer.innerHTML = `
          <div class="error-message">
            <i class="fas fa-times-circle"></i> Invalid number format. Use: 2557xxxxxxxx
          </div>
        `;
        return;
      }

      // Button animation
      submitBtn.style.transform = 'scale(0.95)';
      setTimeout(() => {
        submitBtn.style.transform = '';
      }, 150);

      // Show loading with react emoji like in bot
      submitBtn.innerHTML = '<i class="fas fa-hourglass-half"></i> ⌛ Generating...';
      
      // Show loading, hide result
      waitingMessage.style.display = 'flex';
      resultContainer.innerHTML = '';
      
      try {
        // EXACT API ENDPOINT from your script: /code?number=
        const apiUrl = `${API_BASE}/code?number=${encodeURIComponent(cleanNumber)}`;
        
        console.log('Calling API:', apiUrl);
        
        // Make the actual API call with proper headers
        const response = await axios.get(apiUrl, {
          headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json'
          },
          timeout: 30000 // 30 second timeout
        });
        
        console.log('API Response:', response.data);
        
        // Check response format - the API might return the code directly or in a property
        let pairingCode = '';
        
        if (typeof response.data === 'string') {
          // If response is directly a string
          pairingCode = response.data;
        } else if (response.data.code) {
          // If response has code property
          pairingCode = response.data.code;
        } else if (response.data.pairingCode) {
          // If response has pairingCode property
          pairingCode = response.data.pairingCode;
        } else if (response.data.data && response.data.data.code) {
          // If nested in data property
          pairingCode = response.data.data.code;
        } else {
          // Try to stringify the whole response
          pairingCode = JSON.stringify(response.data);
        }

        if (!pairingCode) {
          throw new Error('No code received from API');
        }

        // Clean the code - remove any quotes or extra characters
        pairingCode = pairingCode.toString().replace(/["']/g, '').trim();
        currentPairingCode = pairingCode;
        
        // Format code with spaces every 4 characters for display
        const formattedCode = pairingCode.match(/.{1,4}/g)?.join(' ') || pairingCode;
        
        // Hide loader and update button
        waitingMessage.style.display = 'none';
        
        // Show success react
        submitBtn.innerHTML = '<i class="fas fa-check"></i> ✅ Success!';
        setTimeout(() => {
          submitBtn.innerHTML = '<i class="fas fa-bolt"></i> Generate Code';
        }, 2000);
        
        // Display result matching bot's interactive message format EXACTLY
        resultContainer.innerHTML = `
          <div class="code-display">
            <div class="code-label">
              <i class="fas fa-key"></i> 🩷 DEVICE WANT TO LOGIN
            </div>
            <div class="code-value">
              This is your Code:<br>
              <span class="code-highlight">${formattedCode}</span>
            </div>
            
            <div class="interactive-buttons">
              <button class="interactive-btn copy-btn" onclick="copyPairingCode(this)">
                <i class="fas fa-copy"></i> Copy Code
              </button>
              
              <a href="https://fee-xmd.online" target="_blank" class="interactive-btn">
                <i class="fas fa-globe"></i> 🌐 Website
              </a>
              
              <a href="https://github.com/Fred1e/Fee-xmd" target="_blank" class="interactive-btn">
                <i class="fab fa-github"></i> ✨ Source Link
              </a>
              
              <a href="https://whatsapp.com/channel/0029Vb6mzVF7tkj42VNPrZ3V" target="_blank" class="interactive-btn">
                <i class="fab fa-whatsapp"></i> 🧧 View Channel
              </a>
            </div>
            
            <div style="color: var(--text-muted); font-size: 12px; margin-top: 15px; text-align: center;">
              <i class="fas fa-clock"></i> Valid for 5 minutes • One-time use
            </div>
          </div>
        `;

      } catch (error) {
        console.error('PAIR ERROR:', error);
        
        // Hide loader
        waitingMessage.style.display = 'none';
        
        // Show error react
        submitBtn.innerHTML = '<i class="fas fa-times"></i> ❌ Failed';
        setTimeout(() => {
          submitBtn.innerHTML = '<i class="fas fa-bolt"></i> Generate Code';
        }, 2000);
        
        // Get detailed error message
        let errorMessage = 'Try again later.';
        if (error.response) {
          // The request was made and the server responded with a status code
          // that falls out of the range of 2xx
          console.error('Error Response Data:', error.response.data);
          console.error('Error Response Status:', error.response.status);
          
          if (error.response.status === 503) {
            errorMessage = 'Service temporarily unavailable (503). Please try again in a few moments.';
          } else if (error.response.data) {
            if (typeof error.response.data === 'string') {
              errorMessage = error.response.data;
            } else if (error.response.data.message) {
              errorMessage = error.response.data.message;
            } else if (error.response.data.error) {
              errorMessage = error.response.data.error;
            }
          }
        } else if (error.request) {
          // The request was made but no response was received
          errorMessage = 'No response from server. Please check your connection.';
        } else {
          // Something happened in setting up the request that triggered an Error
          errorMessage = error.message;
        }
        
        // Display error message exactly like bot
        resultContainer.innerHTML = `
          <div class="error-message">
            <i class="fas fa-exclamation-triangle"></i> ❌ Failed to generate pairing code.<br>
            <small>${errorMessage}</small>
          </div>
        `;
      }
    }

    // Event Listeners
    document.addEventListener('DOMContentLoaded', () => {
      createParticles();
      checkAPIStatus();
      
      // Check API status every 30 seconds
      setInterval(checkAPIStatus, 30000);
      
      const submitBtn = document.getElementById('submitBtn');
      const phoneInput = document.getElementById('number');
      
      submitBtn.addEventListener('click', (e) => {
        e.preventDefault();
        generatePairCode();
      });
      
      // Allow Enter key to submit
      phoneInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          generatePairCode();
        }
      });
      
      // Auto-format phone number
      phoneInput.addEventListener('input', (e) => {
        let value = e.target.value.replace(/[^0-9]/g, '');
        value = formatPhoneNumber(value);
        e.target.value = value;
      });
      
      // Input focus effects
      phoneInput.addEventListener('focus', () => {
        document.querySelector('.input-wrapper').classList.add('focused');
      });

      phoneInput.addEventListener('blur', () => {
        document.querySelector('.input-wrapper').classList.remove('focused');
      });
    });
  </script>
</body>
